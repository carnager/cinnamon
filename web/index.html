<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Popcorn</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/theater.css">
  </head>
  <body>
    <section id="authScreen" class="auth-screen">
      <form id="loginForm" class="login-panel">
        <div class="login-brand">Popcorn</div>
        <label class="field">
          <span>Username</span>
          <input id="loginUser" type="text" autocomplete="username" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input id="loginPass" type="password" autocomplete="current-password" required>
        </label>
        <button id="loginBtn" class="primary" type="submit">Sign In</button>
        <div id="loginError" class="login-error"></div>
      </form>
    </section>
    <main id="appShell" class="shell hidden">
      <aside class="app-sidebar">
        <div class="sidebar-brand">Popcorn</div>
        <nav id="libraryNav" class="library-nav"></nav>
      </aside>
      <header class="topbar">
        <div id="topbarFilters" class="topbar-left topbar-filters"></div>
        <div class="topbar-right">
          <label class="search-field">
            <span>Search</span>
            <input id="search" type="search" placeholder="Search movies and shows" autocomplete="off">
          </label>
          <div id="userPanel" class="user-panel"></div>
        </div>
      </header>
      <section class="content">
        <div id="view" class="view"></div>
      </section>
    </main>
    <div id="theater" class="theater hidden">
      <div class="theater-inner">
        <video id="player" playsinline></video>
        <div id="playerStatus" class="player-status hidden"><span class="player-spinner"></span><span id="playerStatusText"></span></div>
        <div id="upNext" class="up-next hidden"></div>
        <div class="player-ui">
          <div class="player-top">
            <button id="closePlayer" class="pbtn pbtn-ghost" type="button" aria-label="Close">‹ Back</button>
            <div id="nowPlaying" class="player-title"></div>
          </div>
          <button id="centerToggle" class="player-center-toggle" type="button" aria-label="Play/Pause"></button>
          <div class="player-bottom">
            <div class="seek-row">
              <span id="currentTime" class="player-time">0:00</span>
              <div class="seekbar">
                <div id="seekBuffered" class="seek-buffered"></div>
                <div id="seekPlayed" class="seek-played"></div>
                <input id="timeline" class="seek-input" type="range" min="0" max="0" value="0" step="1" aria-label="Seek">
              </div>
              <span id="duration" class="player-time">0:00</span>
            </div>
            <div class="control-row">
              <button id="playPause" class="pbtn pbtn-icon" type="button" aria-label="Play"></button>
              <button id="rewBtn" class="pbtn pbtn-icon" type="button" aria-label="Back 10 seconds" title="Back 10s"></button>
              <button id="ffwdBtn" class="pbtn pbtn-icon" type="button" aria-label="Forward 30 seconds" title="Forward 30s"></button>
              <div class="control-volume">
                <button id="muteBtn" class="pbtn pbtn-icon" type="button" aria-label="Mute"></button>
                <input id="volume" class="volume-slider" type="range" min="0" max="1" value="1" step="0.01" aria-label="Volume">
              </div>
              <div class="control-spacer"></div>
              <button id="nextEpBtn" class="pbtn pbtn-text hidden" type="button" aria-label="Next episode">Next ›</button>
              <div class="menu-anchor">
                <button id="audioBtn" class="pbtn pbtn-text" type="button" aria-haspopup="true" aria-expanded="false">Audio</button>
                <div id="audioMenu" class="player-menu hidden"></div>
              </div>
              <div class="menu-anchor">
                <button id="subsBtn" class="pbtn pbtn-text" type="button" aria-haspopup="true" aria-expanded="false">Subtitles</button>
                <div id="subsMenu" class="player-menu hidden"></div>
              </div>
              <div class="menu-anchor">
                <button id="qualityBtn" class="pbtn pbtn-text" type="button" aria-haspopup="true" aria-expanded="false">Auto</button>
                <div id="qualityMenu" class="player-menu hidden"></div>
              </div>
              <button id="fullscreenBtn" class="pbtn pbtn-icon" type="button" aria-label="Fullscreen"></button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="/hls.min.js"></script>
    <script src="/views.js"></script>
    <script src="/playback.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
