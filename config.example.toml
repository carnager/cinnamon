listen = ":8097"
logLevel = "info"
databasePath = "./popcorn.db"
ffmpegPath = "ffmpeg"
ffprobePath = "ffprobe"
hwAccel = "vaapi"
hwDevice = "/dev/dri/renderD128"
traktClientId = ""
traktClientSecret = ""
tmdbApiKey = ""
tmdbReadAccessToken = ""
omdbApiKey = ""
scanOnStart = false
autoScan = false
autoScanDebounce = "3s"
autoScanInterval = "6h"
autoScanWatchDepth = 0
scanTimeout = "30m"
# Safety net: even with autoScan off (e.g. popcorn-watch drives imports), a
# cheap mtime-diff sweep runs at this interval so anything a lost event missed
# still appears. "0s" disables it.
reconcileInterval = "1h"

# Optional static Android self-update support for deployments where the server
# can read APK files from local paths. For normal use, upload release APKs from
# the web admin App Updates screen instead.
# [appUpdate]
# tvApkPath = "/opt/popcorn/popcorn-tv-latest.apk"
# tvVersionCode = 26060305
# tvVersionName = "0.2.0"
# tvReleaseNotes = "Popcorn 0.2.0"
# companionApkPath = "/opt/popcorn/popcorn-companion-latest.apk"
# companionVersionCode = 26060305
# companionVersionName = "0.2.0"
# companionReleaseNotes = "Popcorn 0.2.0"

[[libraries]]
id = "movies"
name = "Movies"
type = "movies"
path = "/media/movies"

[[libraries]]
id = "tv"
name = "TV Shows"
type = "tv"
path = "/media/tv"
