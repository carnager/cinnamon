<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Popcorn</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/theater.css">
  </head>
  <body>
    <section id="authScreen" class="auth-screen">
      <form id="loginForm" class="login-panel">
        <div class="login-brand">Popcorn</div>
        <label class="field">
          <span>Username</span>
          <input id="loginUser" type="text" autocomplete="username" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input id="loginPass" type="password" autocomplete="current-password" required>
        </label>
        <button id="loginBtn" class="primary" type="submit">Sign In</button>
        <div id="loginError" class="login-error"></div>
      </form>
    </section>
    <main id="appShell" class="shell hidden">
      <aside class="app-sidebar">
        <div class="sidebar-brand">Popcorn</div>
        <nav id="libraryNav" class="library-nav"></nav>
      </aside>
      <header class="topbar">
        <div id="topbarFilters" class="topbar-left topbar-filters"></div>
        <div class="topbar-right">
          <label class="search-field">
            <span>Search</span>
            <input id="search" type="search" placeholder="Search movies and shows" autocomplete="off">
          </label>
          <div id="userPanel" class="user-panel"></div>
        </div>
      </header>
      <section class="content">
        <div id="view" class="view"></div>
      </section>
    </main>
    <div id="theater" class="theater hidden">
      <div class="theater-inner">
        <video id="player" playsinline></video>
        <div class="theater-controls">
          <button id="playPause" class="theater-btn" type="button" aria-label="Play">Play</button>
          <span id="currentTime" class="theater-time">0:00</span>
          <input id="timeline" class="theater-timeline" type="range" min="0" max="0" value="0" step="1">
          <span id="duration" class="theater-time">0:00</span>
          <div id="nowPlaying" class="theater-title"></div>
          <div class="theater-volume">
            <button id="muteBtn" class="theater-btn theater-mute" type="button" aria-label="Mute">Vol</button>
            <input id="volume" class="theater-volume-slider" type="range" min="0" max="1" value="1" step="0.01" aria-label="Volume">
          </div>
          <div class="theater-playback-opts">
            <label class="theater-toggle" title="Transcode">
              <input id="transcode" type="checkbox">
              <span>Transcode</span>
            </label>
            <select id="bandwidth" class="theater-select" title="Bitrate">
              <option value="1500">1.5 Mbps</option>
              <option value="3000">3 Mbps</option>
              <option value="6000" selected>6 Mbps</option>
              <option value="12000">12 Mbps</option>
              <option value="20000">20 Mbps</option>
            </select>
          </div>
          <button id="fullscreenBtn" class="theater-btn" type="button" aria-label="Fullscreen">Fullscreen</button>
          <button id="closePlayer" class="theater-btn" type="button" aria-label="Close">Close</button>
        </div>
      </div>
    </div>
    <script src="/hls.min.js"></script>
    <script src="/views.js"></script>
    <script src="/playback.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
